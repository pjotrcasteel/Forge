name: Publish NuGet

on:
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: read

env:
  NUGET_PACKAGES: ${{ github.workspace }}/artifacts/nuget-cache

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Forge.slnx

      - name: Read package version
        id: package_version
        run: echo "version=$(sed -n 's:.*<ForgeVersion>\(.*\)</ForgeVersion>.*:\1:p' Directory.Build.props)" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        if: github.event_name == 'release'
        run: test "${{ github.event.release.tag_name }}" = "v${{ steps.package_version.outputs.version }}"

      - name: Build and test
        run: |
          dotnet build Forge.slnx -c Release --no-restore
          dotnet test Forge.slnx -c Release --no-build

      - name: Publish AOT smoke sample
        run: dotnet publish samples/Forge.Aot.Sample/Forge.Aot.Sample.csproj -c Release -r linux-x64 --no-restore

      - name: Pack
        run: |
          dotnet pack src/Forge.Delta/Forge.Delta.csproj -c Release --no-build -o artifacts/packages
          dotnet pack src/Forge.Sync/Forge.Sync.csproj -c Release --no-build -o artifacts/packages
          dotnet pack src/Forge.Parse/Forge.Parse.csproj -c Release --no-build -o artifacts/packages
          dotnet pack src/Forge.Parse.Reqnroll/Forge.Parse.Reqnroll.csproj -c Release --no-build -o artifacts/packages

      - name: Validate package layout and metadata
        run: python eng/verify_packages.py artifacts/packages "${{ steps.package_version.outputs.version }}"

      - name: Validate Forge.Delta packed consumer
        run: |
          rm -rf artifacts/package-consumers/delta
          NUGET_PACKAGES="$GITHUB_WORKSPACE/artifacts/package-consumers/delta" \
            dotnet restore tests/Forge.Delta.PackageConsumer/Forge.Delta.PackageConsumer.csproj \
              --source artifacts/packages \
              --force-evaluate
          NUGET_PACKAGES="$GITHUB_WORKSPACE/artifacts/package-consumers/delta" \
            dotnet run --project tests/Forge.Delta.PackageConsumer/Forge.Delta.PackageConsumer.csproj \
              -c Release \
              --no-restore

      - name: Validate Forge.Sync packed consumer and transitive Delta
        run: |
          rm -rf artifacts/package-consumers/sync
          NUGET_PACKAGES="$GITHUB_WORKSPACE/artifacts/package-consumers/sync" \
            dotnet restore tests/Forge.PackageConsumer/Forge.PackageConsumer.csproj \
              --source artifacts/packages \
              --force-evaluate
          NUGET_PACKAGES="$GITHUB_WORKSPACE/artifacts/package-consumers/sync" \
            dotnet run --project tests/Forge.PackageConsumer/Forge.PackageConsumer.csproj \
              -c Release \
              --no-restore

      - name: Validate Forge.Parse packed consumer
        run: |
          rm -rf artifacts/package-consumers/parse
          NUGET_PACKAGES="$GITHUB_WORKSPACE/artifacts/package-consumers/parse" \
            dotnet restore tests/Forge.Parse.PackageConsumer/Forge.Parse.PackageConsumer.csproj \
              --source artifacts/packages \
              --force-evaluate
          NUGET_PACKAGES="$GITHUB_WORKSPACE/artifacts/package-consumers/parse" \
            dotnet run --project tests/Forge.Parse.PackageConsumer/Forge.Parse.PackageConsumer.csproj \
              -c Release \
              --no-restore

      - name: Write package checksums
        run: |
          cd artifacts/packages
          sha256sum *.nupkg *.snupkg > SHA256SUMS.txt

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: forge-release-${{ steps.package_version.outputs.version }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/packages/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish Forge.Delta
        run: >-
          dotnet nuget push
          "artifacts/packages/Forge.Delta.${{ steps.package_version.outputs.version }}.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Publish Forge.Sync
        run: >-
          dotnet nuget push
          "artifacts/packages/Forge.Sync.${{ steps.package_version.outputs.version }}.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Publish Forge.Parse
        run: >-
          dotnet nuget push
          "artifacts/packages/Forge.Parse.${{ steps.package_version.outputs.version }}.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Publish Forge.Parse.Reqnroll
        run: >-
          dotnet nuget push
          "artifacts/packages/Forge.Parse.Reqnroll.${{ steps.package_version.outputs.version }}.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
